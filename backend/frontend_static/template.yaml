AWSTemplateFormatVersion: "2010-09-09"
Description: PilarPrep static frontend hosted on S3 and CloudFront

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Workload identity
        Parameters:
          - ResourcePrefix
          - ProjectName
          - EnvironmentName
          - Owner
          - CostCenter
      - Label:
          default: Frontend hosting
        Parameters:
          - FrontendBucketName
          - WebACLId
          - CloudFrontPriceClass

Parameters:
  WebACLId:
    Type: String
    Default: ""
    Description: Optional existing AWS WAF web ACL ARN to keep attached to CloudFront.
  CloudFrontPriceClass:
    Type: String
    Default: ""
    Description: Optional CloudFront price class. Leave empty when using the CloudFront free pricing plan.
    AllowedValues:
      - ""
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
  ResourcePrefix:
    Type: String
    Default: pillarprep-demo
    Description: Lowercase prefix used for safe display names and Name tags.
    AllowedPattern: "^[a-z0-9][a-z0-9-]{2,40}$"
  ProjectName:
    Type: String
    Default: PilarPrep
  EnvironmentName:
    Type: String
    Default: demo
  Owner:
    Type: String
    Default: austin-adams
  CostCenter:
    Type: String
    Default: hackathon
  FrontendBucketName:
    Type: String
    Description: Globally unique S3 bucket name for static frontend assets.

Conditions:
  HasWebAcl: !Not [!Equals [!Ref WebACLId, ""]]
  HasPriceClass: !Not [!Equals [!Ref CloudFrontPriceClass, ""]]

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref FrontendBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-web-assets"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Application
          Value: sa-briefing-generator
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: cloudformation
        - Key: Repository
          Value: aadams35/Pilarprep
        - Key: DataClassification
          Value: demo

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ResourcePrefix}-frontend-oac"
        Description: PilarPrep frontend S3 origin access control
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${ProjectName} ${EnvironmentName} static frontend"
        WebACLId: !If [HasWebAcl, !Ref WebACLId, !Ref "AWS::NoValue"]
        Enabled: true
        HttpVersion: http2and3
        DefaultRootObject: index.html
        PriceClass: !If [HasPriceClass, !Ref CloudFrontPriceClass, !Ref "AWS::NoValue"]
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-cloudfront-web"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Application
          Value: sa-briefing-generator
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: cloudformation
        - Key: Repository
          Value: aadams35/Pilarprep
        - Key: DataClassification
          Value: demo

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

Outputs:
  ResourceNamePrefix:
    Description: Name prefix used in tags and safe display names.
    Value: !Ref ResourcePrefix
  FrontendBucketName:
    Description: S3 bucket containing the static frontend.
    Value: !Ref FrontendBucket
  CloudFrontDistributionId:
    Description: CloudFront distribution ID.
    Value: !Ref FrontendDistribution
  CloudFrontDomainName:
    Description: CloudFront distribution domain name.
    Value: !GetAtt FrontendDistribution.DomainName
  FrontendUrl:
    Description: HTTPS URL for the AWS-hosted PilarPrep frontend.
    Value: !Sub "https://${FrontendDistribution.DomainName}"