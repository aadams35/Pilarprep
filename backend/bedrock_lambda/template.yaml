AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: PillarPrep Bedrock briefing backend

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Workload identity
        Parameters:
          - ResourcePrefix
          - ProjectName
          - EnvironmentName
          - Owner
          - CostCenter
      - Label:
          default: Bedrock and API settings
        Parameters:
          - BedrockModelId
          - AllowedOrigin
          - PillarPrepApiKey
    ParameterLabels:
      ResourcePrefix:
        default: Resource name prefix
      ProjectName:
        default: Project tag
      EnvironmentName:
        default: Environment tag
      Owner:
        default: Owner tag
      CostCenter:
        default: Cost center tag

Parameters:
  ResourcePrefix:
    Type: String
    Default: pillarprep-demo
    Description: Lowercase prefix used for safe display names and Name tags.
    AllowedPattern: "^[a-z0-9][a-z0-9-]{2,40}$"
  ProjectName:
    Type: String
    Default: PillarPrep
  EnvironmentName:
    Type: String
    Default: demo
  Owner:
    Type: String
    Default: austin-adams
  CostCenter:
    Type: String
    Default: hackathon
  BedrockModelId:
    Type: String
    Default: us.amazon.nova-micro-v1:0
  AllowedOrigin:
    Type: String
    Default: "*"
  PillarPrepApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional shared secret required in the x-api-key header.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        ARTIFACT_BUCKET: !Ref BriefArtifactsBucket
        PROJECT_TABLE: !Ref ProjectStateTable
        PILLARPREP_API_KEY: !Ref PillarPrepApiKey

Resources:
  BriefApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub "${ResourcePrefix}-brief-api"
      Description: !Sub "${ProjectName} ${EnvironmentName} HTTP API for SA brief generation"
      PropagateTags: true
      Tags:
        Name: !Sub "${ResourcePrefix}-brief-api"
        Project: !Ref ProjectName
        Application: sa-briefing-generator
        Environment: !Ref EnvironmentName
        Owner: !Ref Owner
        CostCenter: !Ref CostCenter
        ManagedBy: cloudformation
        Repository: aadams35/Pilarprep
        DataClassification: demo
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowHeaders:
          - content-type
          - x-api-key
        AllowMethods:
          - POST
          - OPTIONS

  BriefFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: !Sub "${ProjectName} ${EnvironmentName} Bedrock brief generator and Project Brain handler"
      CodeUri: .
      Handler: app.handler
      PropagateTags: true
      Tags:
        Name: !Sub "${ResourcePrefix}-brief-generator"
        Project: !Ref ProjectName
        Application: sa-briefing-generator
        Environment: !Ref EnvironmentName
        Owner: !Ref Owner
        CostCenter: !Ref CostCenter
        ManagedBy: cloudformation
        Repository: aadams35/Pilarprep
        DataClassification: demo
      Events:
        GenerateBrief:
          Type: HttpApi
          Properties:
            ApiId: !Ref BriefApi
            Path: /brief
            Method: POST
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource: "*"
        - Statement:
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub "${BriefArtifactsBucket.Arn}/*"
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:Query
              - dynamodb:UpdateItem
            Resource: !GetAtt ProjectStateTable.Arn

  BriefArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-brief-artifacts"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Application
          Value: sa-briefing-generator
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: cloudformation
        - Key: Repository
          Value: aadams35/Pilarprep
        - Key: DataClassification
          Value: demo

  ProjectStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: projectId
          AttributeType: S
        - AttributeName: sortKey
          AttributeType: S
      KeySchema:
        - AttributeName: projectId
          KeyType: HASH
        - AttributeName: sortKey
          KeyType: RANGE
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-project-state"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Application
          Value: sa-briefing-generator
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: cloudformation
        - Key: Repository
          Value: aadams35/Pilarprep
        - Key: DataClassification
          Value: demo

  PillarPrepDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${ResourcePrefix}-ops-dashboard"
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-ops-dashboard"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Application
          Value: sa-briefing-generator
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: cloudformation
        - Key: Repository
          Value: aadams35/Pilarprep
        - Key: DataClassification
          Value: demo
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "PillarPrep Requests and Success",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "metrics": [
                  ["PillarPrep", "BriefRequests", "Service", "BriefFunction"],
                  [".", "BriefSuccess", ".", "."],
                  [".", "UnauthorizedRequests", ".", "."]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda Duration and Errors",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${BriefFunction}"],
                  [".", "Errors", ".", "."],
                  [".", "Invocations", ".", "."]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "API Gateway Requests",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiId", "${BriefApi}"],
                  [".", "4xx", ".", "."],
                  [".", "5xx", ".", "."]
                ]
              }
            },
            {
              "type": "log",
              "x": 12,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Recent Lambda Logs",
                "region": "${AWS::Region}",
                "query": "SOURCE '/aws/lambda/${BriefFunction}' | fields @timestamp, @message | sort @timestamp desc | limit 20",
                "view": "table"
              }
            }
          ]
        }

Outputs:
  BriefApiUrl:
    Description: API Gateway endpoint for PillarPrep brief generation
    Value: !Sub "https://${BriefApi}.execute-api.${AWS::Region}.amazonaws.com/brief"
  ResourceNamePrefix:
    Description: Name prefix used in tags and safe display names
    Value: !Ref ResourcePrefix
  ArtifactBucketName:
    Description: S3 bucket for approved briefs and project artifacts
    Value: !Ref BriefArtifactsBucket
  ProjectStateTableName:
    Description: DynamoDB table for project state
    Value: !Ref ProjectStateTable
  DashboardName:
    Description: CloudWatch dashboard for PillarPrep backend operations
    Value: !Ref PillarPrepDashboard
  DashboardUrl:
    Description: CloudWatch dashboard URL
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${PillarPrepDashboard}"