AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: PillarPrep Bedrock briefing backend

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Workload identity
        Parameters:
          - ResourcePrefix
          - ProjectName
          - EnvironmentName
          - Owner
          - CostCenter
      - Label:
          default: Bedrock and API settings
        Parameters:
          - BedrockModelId
          - BedrockFoundationModelId
          - AllowedOrigin
          - PillarPrepApiKey
          - PermissionsBoundaryArn
    ParameterLabels:
      ResourcePrefix:
        default: Resource name prefix
      ProjectName:
        default: Project tag
      EnvironmentName:
        default: Environment tag
      Owner:
        default: Owner tag
      CostCenter:
        default: Cost center tag

Parameters:
  ResourcePrefix:
    Type: String
    Default: pillarprep-demo
    Description: Lowercase prefix used for safe display names and Name tags.
    AllowedPattern: "^[a-z0-9][a-z0-9-]{2,40}$"
  ProjectName:
    Type: String
    Default: PillarPrep
  EnvironmentName:
    Type: String
    Default: demo
  Owner:
    Type: String
    Default: austin-adams
  CostCenter:
    Type: String
    Default: hackathon
  BedrockModelId:
    Type: String
    Default: us.amazon.nova-micro-v1:0
  BedrockFoundationModelId:
    Type: String
    Default: amazon.nova-micro-v1:0
    Description: Underlying Bedrock foundation model ARN segment allowed by the Lambda IAM role.
  AllowedOrigin:
    Type: String
    Default: "*"
  PillarPrepApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional shared secret required in the x-api-key header.
  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: Optional IAM permissions boundary ARN attached to the Lambda execution role.

Conditions:
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        ARTIFACT_BUCKET: !Ref BriefArtifactsBucket
        PROJECT_TABLE: !Ref ProjectStateTable
        PILLARPREP_API_KEY: !Ref PillarPrepApiKey

Resources:
  BriefApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub "${ResourcePrefix}-brief-api"
      Description: !Sub "${ProjectName} ${EnvironmentName} HTTP API for SA brief generation"
      PropagateTags: true
      Tags:
        Name: !Sub "${ResourcePrefix}-brief-api"
        Project: !Ref ProjectName
        Application: sa-briefing-generator
        Environment: !Ref EnvironmentName
        Owner: !Ref Owner
        CostCenter: !Ref CostCenter
        ManagedBy: cloudformation
        Repository: aadams35/Pilarprep
        DataClassification: demo
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowHeaders:
          - content-type
          - x-api-key
        AllowMethods:
          - POST
          - OPTIONS

  BriefFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ResourcePrefix}-brief-generator"
      RetentionInDays: 14
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-brief-generator-logs"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Application
          Value: sa-briefing-generator
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: cloudformation
        - Key: Repository
          Value: aadams35/Pilarprep
        - Key: DataClassification
          Value: demo

  BriefFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ResourcePrefix}-brief-generator-role"
      Description: !Sub "Least-privilege Lambda role for ${ProjectName} ${EnvironmentName} brief generation"
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref "AWS::NoValue"]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-brief-generator-role"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Application
          Value: sa-briefing-generator
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: cloudformation
        - Key: Repository
          Value: aadams35/Pilarprep
        - Key: DataClassification
          Value: demo
      Policies:
        - PolicyName: !Sub "${ResourcePrefix}-lambda-logs"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLambdaLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ResourcePrefix}-brief-generator:*"
        - PolicyName: !Sub "${ResourcePrefix}-xray-tracing"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PublishXRayTraceSegments
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"
        - PolicyName: !Sub "${ResourcePrefix}-bedrock-invoke"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeConfiguredBedrockModel
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/${BedrockFoundationModelId}"
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/${BedrockModelId}"
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:application-inference-profile/*"
        - PolicyName: !Sub "${ResourcePrefix}-project-artifacts"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteBriefArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${BriefArtifactsBucket.Arn}/*"
              - Sid: UpdateProjectState
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource: !GetAtt ProjectStateTable.Arn

  BriefFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - BriefFunctionLogGroup
    Properties:
      FunctionName: !Sub "${ResourcePrefix}-brief-generator"
      Description: !Sub "${ProjectName} ${EnvironmentName} Bedrock brief generator and Project Brain handler"
      CodeUri: .
      Handler: app.handler
      Role: !GetAtt BriefFunctionRole.Arn
      PropagateTags: true
      Tags:
        Name: !Sub "${ResourcePrefix}-brief-generator"
        Project: !Ref ProjectName
        Application: sa-briefing-generator
        Environment: !Ref EnvironmentName
        Owner: !Ref Owner
        CostCenter: !Ref CostCenter
        ManagedBy: cloudformation
        Repository: aadams35/Pilarprep
        DataClassification: demo
      Events:
        GenerateBrief:
          Type: HttpApi
          Properties:
            ApiId: !Ref BriefApi
            Path: /brief
            Method: POST

  BriefArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-brief-artifacts"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Application
          Value: sa-briefing-generator
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: cloudformation
        - Key: Repository
          Value: aadams35/Pilarprep
        - Key: DataClassification
          Value: demo

  ProjectStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: projectId
          AttributeType: S
        - AttributeName: sortKey
          AttributeType: S
      KeySchema:
        - AttributeName: projectId
          KeyType: HASH
        - AttributeName: sortKey
          KeyType: RANGE
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-project-state"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Application
          Value: sa-briefing-generator
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: cloudformation
        - Key: Repository
          Value: aadams35/Pilarprep
        - Key: DataClassification
          Value: demo

  PillarPrepDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${ResourcePrefix}-ops-dashboard"
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-ops-dashboard"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Application
          Value: sa-briefing-generator
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: cloudformation
        - Key: Repository
          Value: aadams35/Pilarprep
        - Key: DataClassification
          Value: demo
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "PillarPrep Requests and Success",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "metrics": [
                  ["PillarPrep", "BriefRequests", "Service", "BriefFunction"],
                  [".", "BriefSuccess", ".", "."],
                  [".", "UnauthorizedRequests", ".", "."]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda Duration and Errors",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${BriefFunction}"],
                  [".", "Errors", ".", "."],
                  [".", "Invocations", ".", "."]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "API Gateway Requests",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiId", "${BriefApi}"],
                  [".", "4xx", ".", "."],
                  [".", "5xx", ".", "."]
                ]
              }
            },
            {
              "type": "log",
              "x": 12,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Recent Lambda Logs",
                "region": "${AWS::Region}",
                "query": "SOURCE '/aws/lambda/${BriefFunction}' | fields @timestamp, @message | sort @timestamp desc | limit 20",
                "view": "table"
              }
            }
          ]
        }

Outputs:
  BriefApiUrl:
    Description: API Gateway endpoint for PillarPrep brief generation
    Value: !Sub "https://${BriefApi}.execute-api.${AWS::Region}.amazonaws.com/brief"
  ResourceNamePrefix:
    Description: Name prefix used in tags and safe display names
    Value: !Ref ResourcePrefix
  ArtifactBucketName:
    Description: S3 bucket for approved briefs and project artifacts
    Value: !Ref BriefArtifactsBucket
  ProjectStateTableName:
    Description: DynamoDB table for project state
    Value: !Ref ProjectStateTable
  BriefFunctionRoleName:
    Description: IAM role used by the Lambda brief generator
    Value: !Ref BriefFunctionRole
  DashboardName:
    Description: CloudWatch dashboard for PillarPrep backend operations
    Value: !Ref PillarPrepDashboard
  DashboardUrl:
    Description: CloudWatch dashboard URL
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${PillarPrepDashboard}"